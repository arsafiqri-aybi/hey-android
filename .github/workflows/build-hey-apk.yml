name: Build Hey Android APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch to compile into an APK'
        required: true
        type: string
        default: 'feat/hey-home-ultra-compact-apk-20261010'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK 35
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          if [ -d "${ANDROID_HOME}/platforms/android-35" ] && [ -d "${ANDROID_HOME}/build-tools/35.0.0" ]; then
            echo "SDK 35 and build-tools 35.0.0 already available"
          else
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
            if [ -z "${SDKMANAGER}" ]; then echo "SDK manager not found"; exit 1; fi
            "${SDKMANAGER}" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Run Android lint
        if: success()
        run: gradle --no-daemon :app:lintDebug
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hey-ultra-compact-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
