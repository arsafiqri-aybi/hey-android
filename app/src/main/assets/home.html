<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hey</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}body{font-family:Roboto,"Segoe UI",Arial,sans-serif;color:#fff;background:#284538 url('wallpaper.webp') center center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#071b1e66,#173e3513 40%,#091e174f);pointer-events:none}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}

.brand{font-size:28px;font-weight:750;letter-spacing:-1.4px}.status{display:flex;align-items:center;gap:8px;min-height:38px;border-radius:99px;border:1px solid #ffffffe0;background:#f2fcf456;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 3px 7px #20382b44,inset 0 1px #ffffffa8;padding:0 13px;font-size:12px;font-weight:550}.dot{width:8px;height:8px;border-radius:50%;background:#36eea4;box-shadow:0 0 0 5px #1ff19b2a,0 0 10px #1ff19b99}.status[data-status="OFFLINE"] .dot,.status[data-status="ERROR"] .dot,.status[data-status="UNKNOWN"] .dot{background:#f5b291;box-shadow:0 0 0 5px #f5b29130}.status[data-status="PAUSED"] .dot,.status[data-status="CONNECTING"] .dot{background:#fce59b;box-shadow:0 0 0 5px #fce59b30}
.main{position:relative;z-index:1;padding:clamp(186px,27vh,242px) 20px 116px}
.browser{display:block;border-radius:26px;border:1px solid #ffffffa3;background:linear-gradient(140deg,#8ca89a80,#b3bea67a);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 27px #1c342b3c,inset 0 1px #ffffff56;padding:17px;min-height:244px;transition:transform .16s ease,background .16s ease}.browser:active{transform:scale(.985);background:#b6c8b097}
.identity{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:42px}.iconbox{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid #ffffffb8;background:#deebdf59;box-shadow:inset 0 1px #ffffffa5}.iconbox svg{width:23px;height:23px;stroke:#f2fff4}.identity strong{font-size:20px;font-weight:710;letter-spacing:-.7px}
.preview{height:146px;border-radius:20px;border:1px solid #fff;background:linear-gradient(155deg,#f6fbf4e7,#d4e5d5e0,#eff7ece1);box-shadow:inset 0 1px #fff,0 4px 13px #22423235;display:grid;place-items:center;overflow:hidden}.greeting{color:#496c56;font-size:36px;font-weight:430;letter-spacing:-1.2px;transition:opacity .55s ease,transform .55s ease;white-space:nowrap;max-width:100%}.greeting.fade{opacity:0;transform:scale(.985)}
.activity{display:flex;align-items:center;gap:13px;margin-top:20px;height:72px;padding:0 16px;border-radius:20px;border:1px solid #ffffff8c;background:#a7b8a074;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px #ffffff56}.activity:active{background:#afc8a2b5}.activity svg{width:20px;height:20px;stroke:white;fill:none;flex:none}.activity-copy{display:flex;flex-direction:column;min-width:0;gap:3px}.activity-title{font-size:14px;font-weight:650}.activity-detail{font-size:12px;opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock{position:fixed;z-index:10;left:20px;right:20px;bottom:calc(26px + env(safe-area-inset-bottom,0px));height:68px;border-radius:22px;border:1px solid #ffffffae;background:#829e83c2;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 8px 20px #09201742,inset 0 1px #ffffff62;padding:4px;display:flex;gap:3px}.tab{flex:1;min-width:0;min-height:58px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border-radius:18px;font-size:11px;transition:transform .16s ease}.tab:active{transform:scale(.95)}.tab svg{height:21px;width:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.tab.active{background:#f0fbebc6;border:1px solid #ffffffd6;color:#335e45;box-shadow:0 3px 9px #1b332b30,inset 0 1px #fff}.tab.active span{font-weight:700}
@media(max-height:750px){.main{padding-top:170px}.preview{height:128px}.browser{min-height:226px}}@media(max-width:345px){.header,.dock{left:15px;right:15px}.main{padding-left:15px;padding-right:15px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body>
<header class="header"><span class="brand">Hey</span><a href="hey-action://status" class="status" id="status" data-status="UNKNOWN"><i class="dot"></i><span id="status-label">Memeriksa…</span></a></header>

<a class="tab" href="hey-action://browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/></svg><span>Browser</span></a>
<a class="tab" href="hey-action://tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span>Tasks</span></a>

</nav>
<script>(function(){const words=["Hello","Halo","Bonjour","こんにちは","안녕하세요","Hey","مرحبًا","Hey"],g=document.getElementById("greeting");let index=0,timer;function next(){if(document.hidden)return;g.classList.add("fade");setTimeout(function(){index=(index+1)%words.length;g.textContent=words[index];g.classList.remove("fade")},570)}function begin(){if(!timer&&!matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(next,3400)}function end(){clearInterval(timer);timer=undefined}document.addEventListener("visibilitychange",function(){document.hidden?end():begin()});begin();window.heySetState=function(state,label,activity){document.getElementById("status").dataset.status=state;document.getElementById("status-label").textContent=label;document.getElementById("activity-detail").textContent=activity}})();</script></body></html>
