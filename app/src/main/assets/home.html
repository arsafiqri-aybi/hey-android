<!doctype html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Hey</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:0px;--safe-right:0px;--gutter:22px;--ease:cubic-bezier(.22,.8,.3,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:#56796e}body{font-family:Roboto,"Segoe UI",Arial,sans-serif;color:#173829;isolation:isolate}
.wallpaper,.shade{position:fixed;inset:0;pointer-events:none}.wallpaper{z-index:-3;width:100%;height:100%;object-fit:cover;object-position:50% 50%}.shade{z-index:-2;background:linear-gradient(180deg,#162e333d 0%,#203e3712 40%,#102f3933 100%)}
a{color:inherit;text-decoration:none;touch-action:manipulation;outline-offset:5px}a:focus-visible{outline:3px solid #fff}
.page{width:100%;max-width:480px;min-height:100vh;min-height:100svh;margin:auto;padding:calc(var(--safe-top) + 16px) calc(var(--gutter) + var(--safe-right)) calc(var(--safe-bottom) + 114px) calc(var(--gutter) + var(--safe-left))}
.glass{border:1px solid #ffffff99;box-shadow:inset 0 1px 0 #ffffff73,0 10px 28px #16372b24;background:linear-gradient(130deg,#a8bdaeeb,#9eb7a6eb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:12px 13px 12px 20px;border-radius:24px}.brand{font-size:25px;font-weight:700;letter-spacing:-1px;line-height:1.2}
.brand-logo{display:block;width:40px;height:40px;flex:none;object-fit:contain}
.status{display:flex;align-items:center;gap:9px;min-height:40px;max-width:calc(100% - 54px);padding:10px 13px;border-radius:999px;border:1px solid #ffffffe0;background:linear-gradient(135deg,#f5faf1db,#e6eee3b3);color:#355443;box-shadow:inset 0 1px #fff,0 3px 8px #183c2b24;font-size:11.5px;font-weight:600;line-height:1.2}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:#858e87;box-shadow:0 0 0 4px #687b7020}.status[data-status="ONLINE"] .dot{background:#1ca775;box-shadow:0 0 0 4px #1ca77521}.status[data-status="CONNECTING"] .dot,.status[data-status="REGISTERING"] .dot,.status[data-status="PAUSED"] .dot{background:#b49043;box-shadow:0 0 0 4px #b490431c}.status[data-status="ERROR"] .dot{background:#b16b54;box-shadow:0 0 0 4px #b16b5420}
.main{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:14px}.browser{display:block;width:100%;padding:16px;border-radius:30px;transition:transform 180ms var(--ease),box-shadow 180ms var(--ease)}
.identity{display:flex;align-items:center;gap:11px;min-height:40px;margin-bottom:15px}.iconbox{display:grid;place-items:center;width:38px;height:38px;flex:none;border:1px solid #ffffffac;border-radius:13px;background:#e3eee43a;box-shadow:inset 0 1px #ffffff80}.iconbox svg{width:21px;height:21px;stroke:currentColor}.identity strong{font-size:18px;font-weight:600;letter-spacing:-.5px;line-height:1.3}
.preview{width:100%;aspect-ratio:4/5;position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffffed;border-radius:23px;background:linear-gradient(145deg,#fafcf4f2,#e0eadcf0 56%,#eff5e9f0);box-shadow:inset 0 1px 0 #fff,0 4px 14px #193e2921}.preview:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 18% 3%,#ffffff75,transparent 64%);pointer-events:none}
.greeting{position:relative;max-width:100%;padding:0 12px;color:#456751;font-size:clamp(36px,10.5vw,43px);font-weight:400;line-height:1.3;letter-spacing:-1.2px;white-space:nowrap;transition:opacity 380ms ease,transform 460ms var(--ease)}.greeting.fade{opacity:0;transform:translateY(5px)}
.activity{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:13px 17px;border-radius:22px}.activity svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none}.activity-copy{display:flex;flex-direction:column;gap:4px;min-width:0}.activity-title{font-size:13px;font-weight:600;line-height:1.3}.activity-detail{font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:fixed;z-index:5;left:calc(var(--gutter) + var(--safe-left));right:calc(var(--gutter) + var(--safe-right));bottom:calc(var(--safe-bottom) + 16px);max-width:436px;margin:auto;min-height:70px;padding:5px;display:flex;gap:3px;border-radius:25px;background:linear-gradient(130deg,#a1b8a8eb,#a5b9a4eb);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tab{flex:1;min-width:0;min-height:58px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border-radius:20px;font-size:10.5px;line-height:1.2;transition:transform 180ms var(--ease),background 180ms ease}.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tab.active{color:#365b44;background:linear-gradient(140deg,#f5f9edee,#dfebdcd9);border:1px solid #ffffffe0;box-shadow:inset 0 1px #fff,0 3px 7px #14362b24}.tab.active span{font-weight:650}.pressable:active{transform:scale(.982)}
@media(max-height:780px) and (min-height:600px){.main{width:min(100%,max(208px,calc((100svh - var(--safe-top) - var(--safe-bottom) - 388px)*.8 + 34px)));margin-left:auto;margin-right:auto}}
@media(max-width:350px){:root{--gutter:16px}.header{padding-left:16px}.status{font-size:10.5px;padding-inline:11px}.brand{font-size:24px}.browser{padding:14px}.identity strong{font-size:17px}}
@media(orientation:landscape) and (max-height:600px){.page{max-width:100%;padding-right:calc(110px + var(--safe-right));padding-bottom:calc(var(--safe-bottom) + 16px)}.main{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}.browser{width:max(126px,calc((100svh - var(--safe-top) - var(--safe-bottom) - 205px)*.8 + 34px));max-width:240px}.activity{max-width:360px;justify-self:center}.greeting{font-size:clamp(16px,4.2vh,24px);padding-inline:4px;letter-spacing:-.6px}.dock{left:auto;right:calc(16px + var(--safe-right));top:calc(var(--safe-top) + 16px);bottom:calc(var(--safe-bottom) + 16px);width:78px;max-width:none;min-height:0;margin:0;flex-direction:column}}
.low-effects .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:#a4b9a6}.reduced-motion *{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body>
<img id="wallpaper" class="wallpaper" alt="" src="wallpaper.webp" decoding="async" fetchpriority="high"><div class="shade"></div>
<div class="page"><header class="header glass"><img class="brand brand-logo" src="hey-logo.svg" alt="Hey." width="40" height="40"><a href="hey-action://status" class="status pressable" id="status" data-status="UNKNOWN" aria-label="Lihat koneksi Hey"><i class="dot" aria-hidden="true"></i><span id="status-label" role="status">Memeriksa…</span></a></header>
<main class="main"><a href="hey-action://browser" class="browser glass pressable" aria-label="Buka Browser Hey"><div class="identity"><span class="iconbox"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/></svg></span><strong>Browser Hey</strong></div><div class="preview"><span id="greeting" class="greeting" aria-hidden="true">Hello</span></div></a>
<a href="hey-action://tasks" class="activity glass pressable"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2.2"/></svg><span class="activity-copy"><span class="activity-title">Aktivitas terbaru</span><span class="activity-detail" id="activity-detail">Belum ada aktivitas</span></span></a></main></div>
<nav class="dock glass" aria-label="Navigasi utama">
<a class="tab active pressable" href="hey-action://home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/></svg><span>Home</span></a>
<a class="tab pressable" href="hey-action://browser"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/></svg><span>Browser</span></a>
<a class="tab pressable" href="hey-action://tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg><span>Tasks</span></a>
<a class="tab pressable" href="hey-action://settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2m10-10h-2m-16 0H2m17-7-1.4 1.4m-11.2 11.2L5 19m14 0-1.4-1.4M6.4 6.4 5 5"/></svg><span>Settings</span></a>
</nav><script>
(()=>{
 const root=document.documentElement,g=document.getElementById('greeting'),motion=matchMedia('(prefers-reduced-motion: reduce)'),words=['Hello','Halo','Bonjour','こんにちは','안녕하세요','Hey','مرحبًا'];
 let index=0,timer=0,swap=0,active=true,nativeReduced=false;
 const stop=()=>{clearTimeout(timer);clearTimeout(swap);timer=swap=0;g.classList.remove('fade')};
 const allowed=()=>active&&!document.hidden&&!motion.matches&&!nativeReduced;
 const schedule=()=>{stop();if(allowed())timer=setTimeout(next,4600)};
 function next(){if(!allowed())return;g.classList.add('fade');swap=setTimeout(()=>{if(!allowed()){stop();return}index=(index+1)%words.length;g.textContent=words[index];g.classList.remove('fade');timer=setTimeout(next,4600)},390)}
 window.heySetActive=value=>{active=!!value;active?schedule():stop()};
 window.heyConfigure=config=>{
  for(const [key,css] of [['safeTop','top'],['safeBottom','bottom'],['safeLeft','left'],['safeRight','right']])if(Number.isFinite(config[key]))root.style.setProperty('--safe-'+css,Math.max(0,config[key])+'px');
  if(/^wallpaper(?:-(?:1080|1440|2160))?\.webp$/.test(config.wallpaper||'')){const im=document.getElementById('wallpaper');if(im.getAttribute('src')!==config.wallpaper)im.src=config.wallpaper}
  nativeReduced=config.reduceMotion===true;root.classList.toggle('reduced-motion',nativeReduced||motion.matches);root.classList.toggle('low-effects',config.lowEffects===true);schedule();
 };
 window.heySetState=(state,label,activity)=>{
  const status=document.getElementById('status'),value=document.getElementById('status-label'),detail=document.getElementById('activity-detail');
  status.dataset.status=String(state||'UNKNOWN');if(value.textContent!==label)value.textContent=label;if(detail.textContent!==activity)detail.textContent=activity;status.setAttribute('aria-label','Koneksi Hey: '+label);
 };
 document.addEventListener('visibilitychange',()=>document.hidden?stop():schedule());
 const changed=()=>{root.classList.toggle('reduced-motion',nativeReduced||motion.matches);schedule()};
 if(motion.addEventListener)motion.addEventListener('change',changed);else motion.addListener(changed);
 addEventListener('pagehide',stop);addEventListener('pageshow',schedule);schedule();
})();
</script></body></html>
