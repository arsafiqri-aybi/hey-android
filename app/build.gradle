plugins { id 'com.android.application' }
android {
    namespace 'id.ars.hey'
    compileSdk 35
    defaultConfig { applicationId 'id.ars.hey'; minSdk 31; targetSdk 35; versionCode 6; versionName '0.3.1-preview'; manifestPlaceholders = [heyAppLabel: 'Hey'] }
    buildFeatures { buildConfig true }
    sourceSets { debug { assets.srcDir "$buildDir/generated/qa-assets" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            applicationIdSuffix '.preview.pearl'
            manifestPlaceholders = [heyAppLabel: 'Hey Pearl Preview']
        }
        release { minifyEnabled false }
    }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:25.1.3'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

// Existing CI invokes testDebugUnitTest: also exercise the actual HTML/DOM adapter in Chromium.
def browserFixtures = tasks.register('verifyBrowserFixtures', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'evaluation/run-browser-fixtures.sh'
}
tasks.configureEach { task ->
    if (task.name == 'testDebugUnitTest' || task.name == 'mergeDebugAssets') task.dependsOn browserFixtures
}

