plugins { id 'com.android.application' }
android {
    namespace 'id.ars.hey'
    compileSdk 35
    defaultConfig { applicationId 'id.ars.hey'; minSdk 31; targetSdk 35; versionCode 5; versionName '0.3.0-preview'; manifestPlaceholders = [heyAppLabel: 'Hey'] }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            manifestPlaceholders = [heyAppLabel: 'Hey Preview']
        }
        release { minifyEnabled false }
    }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:25.1.3'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

